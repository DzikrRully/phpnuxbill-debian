version: '3.8'

services:
  phpnuxbill:
    build: .
    container_name: PHPNuxBill
    ports:
      - "8787:80"       # HTTP
      - "8743:443"     # HTTPS (Apache must be configured for it)
      - "1812:1812/udp" # FreeRADIUS Authentication
      - "1813:1813/udp" # FreeRADIUS Accounting
    volumes:
      - ./html:/var/www/html   # Mount host directory for web content
    restart: unless-stopped
